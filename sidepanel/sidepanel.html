<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Alert</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー (タブ切り替え) -->
    <header class="header">
      <div class="tabs">
        <button class="tab-button active" data-tab="timer" data-i18n="tabTimer">タイマー</button>
        <button class="tab-button" data-tab="alarm" data-i18n="tabAlarm">アラーム</button>
      </div>
      <button id="settings-btn" class="settings-btn" title="設定" data-i18n-title="settingsTitle">
        <img src="../icons/settings.png" alt="設定" data-i18n-alt="settingsTitle" class="settings-icon">
      </button>
    </header>

    <!-- アクティブアイテムヘッダー -->
    <div id="active-header-container" class="active-header-container" style="display: none;">
      <div class="active-header-info">
        <span id="active-header-title" class="active-header-title"></span>
        <span id="active-header-time" class="active-header-time"></span>
      </div>
      <button id="active-header-stop-btn" class="active-header-stop-btn" title="停止">⏹</button>
    </div>

    <!-- メインコンテンツ (カードリスト) -->
    <main class="content">
      <div id="card-list" class="card-list">
        <p class="empty-message" data-i18n="emptyMessage">右下の＋ボタンから追加してください</p>
      </div>
    </main>

    <!-- フローティングアクションボタン -->
    <button id="add-btn" class="fab">+</button>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
